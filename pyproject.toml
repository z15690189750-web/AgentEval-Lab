[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-lab"
version = "0.1.0"
description = "A lightweight evaluation and regression framework for AI agents."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[project.scripts]
agent-eval = "agent_eval_lab.cli:main"

[tool.setuptools.packages.find]
include = ["agent_eval_lab*"]
exclude = [
    "tests*",
    "experiments*",
    "reports*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]